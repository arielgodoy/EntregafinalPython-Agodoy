{% if node.children %}
<li class="nav-item">
    <a class="nav-link menu-link{% if node.active %} active{% endif %}"
       href="#{{ node.collapse_id }}"
       data-bs-toggle="collapse"
       role="button"
       aria-expanded="{% if node.open %}true{% else %}false{% endif %}"
       aria-controls="{{ node.collapse_id }}">
        {% if node.icon %}<i class="{{ node.icon }}"></i> {% endif %}<span data-key="{{ node.label_key }}">{{ node.label }}</span>
    </a>
    <div class="collapse menu-dropdown{% if node.open %} show{% endif %}" id="{{ node.collapse_id }}">
        <ul class="nav nav-sm flex-column">
            {% for child in node.children %}
                {% include "partials/sidebar_node.html" with node=child %}
            {% endfor %}
        </ul>
    </div>
</li>
{% else %}
<li class="nav-item">
    <a href="{% url node.route_name %}" class="nav-link{% if node.active %} active{% endif %}" data-key="{{ node.label_key }}">{{ node.label }}</a>
</li>
{% endif %}
